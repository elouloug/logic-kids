<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Light bulb shape -->
  <circle cx="50" cy="40" r="24" fill="white" opacity="0.95"/>
  <rect x="40" y="60" width="20" height="5" rx="2" fill="white" opacity="0.9"/>
  <rect x="40" y="66" width="20" height="5" rx="2" fill="white" opacity="0.8"/>
  <rect x="42" y="72" width="16" height="6" rx="3" fill="white" opacity="0.7"/>
  <!-- Shine on bulb -->
  <circle cx="40" cy="32" r="6" fill="white" opacity="0.35"/>
  <!-- Exclamation in bulb for "logic" feel -->
  <rect x="47" y="30" width="6" height="14" rx="3" fill="#A78BFA"/>
  <circle cx="50" cy="50" r="3.5" fill="#A78BFA"/>
</svg>
